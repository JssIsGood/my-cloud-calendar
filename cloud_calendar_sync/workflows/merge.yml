name: Auto Merge Calendars

on:
  push:
    paths:
      - 'calendars/**'
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  build-and-merge:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Run Merger Script
      run: python merge_calendars.py

    - name: Commit and Push Master Feed
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add combined_calendar.ics
        git diff-index --quiet HEAD || git commit -m "Automated update of master calendar feed"
        git push
