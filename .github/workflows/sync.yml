name: Sync CSV events to ICS

on:
  repository_dispatch:
    types: [csv-sync]
  workflow_dispatch: {}
  schedule:
    # Safety-net rebuild once a day in case a dispatch event was ever missed.
    # This does NOT contact OneDrive - it just re-runs the CSV -> ICS build
    # from whatever is currently committed in data/.
    - cron: "0 17 * * *" # 03:00 Australia/Brisbane (UTC+10, no DST)

permissions:
  contents: write

concurrency:
  group: ics-sync
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply incoming file change from Power Automate
        if: github.event_name == 'repository_dispatch'
        env:
          EVENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: python scripts/apply_event.py

      - name: Rebuild calendar.ics from current CSV files
        run: python scripts/generate_ics.py

      - name: Commit and push if changed
        run: |
          git config user.name "ics-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs/calendar.ics
          if ! git diff --cached --quiet; then
            git commit -m "Sync: ${{ github.event.client_payload.file_name || 'scheduled rebuild' }}"
            git push
          else
            echo "No changes to commit"
          fi
